[project]
name = "veridex-backend"
version = "0.1.0"
description = "Veridex — AI Agent Governance, Security, Audit & Observability Platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.115.0,<1.0",
    "uvicorn[standard]>=0.30.0,<1.0",
    "pydantic>=2.9.0,<3.0",
    "pydantic-settings>=2.5.0,<3.0",
    "sqlalchemy[asyncio]==2.0.35",
    "asyncpg>=0.30.0,<1.0",
    "alembic>=1.14.0,<2.0",
    "redis>=5.2.0,<6.0",
    "python-jose[cryptography]>=3.3.0,<4.0",
    "passlib[bcrypt]>=1.7.4,<2.0",
    "bcrypt>=4.2.0,<5.0",
    "python-multipart>=0.0.12",
    "httpx>=0.27.0,<1.0",
    "structlog>=24.4.0,<26.0",
    "typer>=0.13.0,<1.0",
    "rich>=13.9.0,<14.0",
    "opentelemetry-api>=1.27.0,<2.0",
    "opentelemetry-sdk>=1.27.0,<2.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.48b0",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    "opentelemetry-exporter-otlp>=1.27.0,<2.0",
    "openai>=1.50.0,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0",
    "pytest-asyncio>=0.24.0,<1.0",
    "pytest-cov>=6.0.0,<7.0",
    "pytest-httpx>=0.34.0,<1.0",
    "ruff>=0.7.0,<1.0",
    "mypy>=1.13.0,<2.0",
    "bandit>=1.8.0,<2.0",
    "safety>=3.2.0,<4.0",
    "factory-boy>=3.3.0,<4.0",
    "aiosqlite>=0.20.0,<1.0",
]

[project.scripts]
veridex = "app.cli:app"

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM", "S", "T20"]
ignore = ["S101", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105"]
"app/cli.py" = ["S603"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
addopts = "-v --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]
