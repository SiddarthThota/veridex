# ============================================================
# Veridex — GitHub Actions CI
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.13"
  NODE_VERSION: "22"

jobs:
  # ──────────────────────────────────────────
  # Backend Tests
  # ──────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: veridex_test
          POSTGRES_USER: veridex
          POSTGRES_PASSWORD: veridex
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        working-directory: backend
        run: python -m ruff check app/ tests/

      - name: Type check (mypy)
        working-directory: backend
        run: python -m mypy app/ --ignore-missing-imports

      - name: Test
        working-directory: backend
        env:
          VERIDEX_DATABASE_URL: "postgresql+asyncpg://veridex:veridex@localhost:5432/veridex_test"
          VERIDEX_REDIS_URL: "redis://localhost:6379/0"
          VERIDEX_ENVIRONMENT: "development"
          VERIDEX_SECRET_KEY: "test-secret-key"
        run: python -m pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

  # ──────────────────────────────────────────
  # Security Scan
  # ──────────────────────────────────────────
  backend-security:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Bandit security scan
        working-directory: backend
        run: python -m bandit -r app/ -f json -o bandit-report.json || true

      - name: Upload security report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json

  # ──────────────────────────────────────────
  # Frontend Checks
  # ──────────────────────────────────────────
  frontend-check:
    name: Frontend Checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Build
        working-directory: frontend
        run: npm run build

  # ──────────────────────────────────────────
  # Docker Build
  # ──────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f docker/backend.Dockerfile -t veridex-backend:test ./backend

      - name: Build frontend image
        run: docker build -f docker/frontend.Dockerfile -t veridex-frontend:test ./frontend
