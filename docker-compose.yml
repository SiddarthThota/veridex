# ==============================================================================
# Veridex — Docker Compose (Development)
# ==============================================================================
# Usage:
#   docker compose up --build          # Start all services
#   docker compose up -d               # Start detached
#   docker compose down -v             # Stop and remove volumes
#   docker compose logs -f backend     # Follow backend logs
# ==============================================================================

services:
  # ──────────────────────────────────────────
  # PostgreSQL Database
  # ──────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: veridex-postgres
    environment:
      POSTGRES_DB: veridex
      POSTGRES_USER: veridex
      POSTGRES_PASSWORD: veridex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridex -d veridex"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Redis
  # ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: veridex-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Backend API
  # ──────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    container_name: veridex-backend
    environment:
      VERIDEX_DATABASE_URL: "postgresql+asyncpg://veridex:veridex@postgres:5432/veridex"
      VERIDEX_REDIS_URL: "redis://redis:6379/0"
      VERIDEX_ENVIRONMENT: "development"
      VERIDEX_DEBUG: "true"
      VERIDEX_SECRET_KEY: "dev-secret-key-change-in-production"
      VERIDEX_CORS_ORIGINS: '["http://localhost:3000"]'
      VERIDEX_OTEL_EXPORTER_ENDPOINT: "http://otel-collector:4317"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 3
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Frontend (Next.js)
  # ──────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    container_name: veridex-frontend
    environment:
      NEXT_PUBLIC_API_URL: "http://localhost:8000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  # ──────────────────────────────────────────
  # OpenTelemetry Collector
  # ──────────────────────────────────────────
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    container_name: veridex-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics (collector)
    depends_on:
      - jaeger
    restart: unless-stopped

  # ──────────────────────────────────────────
  # Jaeger (Tracing)
  # ──────────────────────────────────────────
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: veridex-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Collector HTTP
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
